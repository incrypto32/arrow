name: ODBC Driver Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHERY_DEBUG: 1
  ARROW_ENABLE_TIMING_TESTS: OFF

jobs:
  build-odbc-windows:
    name: Build ODBC Driver and Installer
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ARROW_BUILD_SHARED: ON
      ARROW_BUILD_STATIC: OFF
      ARROW_BUILD_TESTS: OFF
      ARROW_BUILD_TYPE: release
      ARROW_FLIGHT: ON
      ARROW_FLIGHT_SQL: ON
      ARROW_FLIGHT_SQL_ODBC: ON
      ARROW_FLIGHT_SQL_ODBC_INSTALLER: ON
      ARROW_HOME: /mingw64
      ARROW_COMPUTE: ON
      ARROW_DATASET: OFF
      ARROW_GANDIVA: OFF
      ARROW_GCS: OFF
      ARROW_HDFS: OFF
      ARROW_JEMALLOC: OFF
      ARROW_PARQUET: OFF
      ARROW_S3: OFF
      ARROW_SUBSTRAIT: OFF
      ARROW_USE_GLOG: OFF
      ARROW_VERBOSE_THIRDPARTY_BUILD: OFF
      ARROW_WITH_OPENTELEMETRY: OFF
      ARROW_CMAKE_ARGS: >-
        -DARROW_PACKAGE_PREFIX=/mingw64
        -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
    steps:
      - name: Disable Crash Dialogs
        run: |
          reg add `
            "HKCU\SOFTWARE\Microsoft\Windows\Windows Error Reporting" `
            /v DontShowUI `
            /t REG_DWORD `
            /d 1 `
            /f
      - name: Checkout Arrow
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Setup MSYS2
        shell: msys2 {0}
        run: ci/scripts/msys2_setup.sh cpp
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: cpp-ccache-mingw64-${{ hashFiles('cpp/**') }}
          restore-keys: cpp-ccache-mingw64-
      - name: Build ODBC Driver
        shell: msys2 {0}
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$NUMBER_OF_PROCESSORS
          ci/scripts/cpp_build.sh "$(pwd)" "$(pwd)/build"
      - name: Debug CMake Configuration
        shell: msys2 {0}
        run: |
          echo "=========================================="
          echo "INVESTIGATING WHY CPackConfig.cmake IS NOT GENERATED"
          echo "=========================================="
          echo ""

          echo "1. CHECK: Is INSTALLER option in CMakeCache.txt?"
          grep ARROW_FLIGHT_SQL_ODBC_INSTALLER build/cpp/CMakeCache.txt || echo "❌ Option NOT FOUND in cache"
          echo ""

          echo "2. CHECK: What did CMake see during configuration?"
          echo "   (Look for our debug messages in build log above)"
          grep -i "ARROW_FLIGHT_SQL_ODBC_INSTALLER value" build/cpp/CMakeOutput.log 2>/dev/null || echo "   CMakeOutput.log not found, check stdout above"
          echo ""

          echo "3. CHECK: Does CPackConfig.cmake exist?"
          if [ -f build/cpp/src/arrow/flight/sql/odbc/CPackConfig.cmake ]; then
            echo "✅ CPackConfig.cmake EXISTS"
            echo "   Size: $(stat -f%z build/cpp/src/arrow/flight/sql/odbc/CPackConfig.cmake 2>/dev/null || stat -c%s build/cpp/src/arrow/flight/sql/odbc/CPackConfig.cmake) bytes"
            echo ""
            echo "4. CHECK: What's in the generated config?"
            head -20 build/cpp/src/arrow/flight/sql/odbc/CPackConfig.cmake
          else
            echo "❌ CPackConfig.cmake NOT FOUND"
            echo ""
            echo "4. DIAGNOSE: Why wasn't it generated?"
            echo "   a) Check if CMakeLists.txt has include(CPack):"
            grep -n "include(CPack)" cpp/src/arrow/flight/sql/odbc/CMakeLists.txt
            echo ""
            echo "   b) Check if if(INSTALLER) block has proper syntax:"
            grep -B2 -A2 "if.*ARROW_FLIGHT_SQL_ODBC_INSTALLER" cpp/src/arrow/flight/sql/odbc/CMakeLists.txt
            echo ""
            echo "   c) Check ARROW_FLIGHT_SQL_ODBC value (dependency):"
            grep "ARROW_FLIGHT_SQL_ODBC:" build/cpp/CMakeCache.txt | grep -v INSTALLER
            echo ""
            echo "5. CONCLUSION: The if(\$CACHE{ARROW_FLIGHT_SQL_ODBC_INSTALLER}) is likely FALSE"
            echo "   This means CMake is not executing the CPack configuration block."
            echo "   Fallback config will be used instead."
          fi
          echo ""
          echo "=========================================="
      - name: Generate Windows Installer
        shell: msys2 {0}
        run: |
          # If CPackConfig.cmake doesn't exist, create a minimal one
          if [ ! -f build/cpp/src/arrow/flight/sql/odbc/CPackConfig.cmake ]; then
            echo "Creating fallback CPackConfig.cmake"
            cat > build/cpp/src/arrow/flight/sql/odbc/CPackConfig.cmake << 'EOFCPACK'
          set(CPACK_GENERATOR "WIX")
          set(CPACK_CMAKE_GENERATOR "Unix Makefiles")
          set(CPACK_PACKAGE_NAME "Apache Arrow Flight SQL ODBC")
          set(CPACK_PACKAGE_VENDOR "Apache Arrow")
          set(CPACK_PACKAGE_DESCRIPTION_SUMMARY "Apache Arrow Flight SQL ODBC Driver")
          set(CPACK_PACKAGE_DESCRIPTION "ODBC driver for Apache Arrow Flight SQL")
          set(CPACK_PACKAGE_CONTACT "dev@arrow.apache.org")
          set(CPACK_PACKAGE_VERSION_MAJOR "1")
          set(CPACK_PACKAGE_VERSION_MINOR "0")
          set(CPACK_PACKAGE_VERSION_PATCH "0")
          set(CPACK_PACKAGE_FILE_NAME "Apache_Arrow_Flight_SQL_ODBC-1.0.0-win64")
          set(CPACK_PACKAGE_INSTALL_DIRECTORY "Apache Arrow Flight SQL ODBC")
          set(CPACK_PACKAGE_DIRECTORY "D:/a/arrow/arrow/build/cpp/src/arrow/flight/sql/odbc")
          set(CPACK_RESOURCE_FILE_LICENSE "D:/a/arrow/arrow/LICENSE.txt")
          set(CPACK_TOPLEVEL_TAG "Release")
          set(CPACK_WIX_UPGRADE_GUID "DBF27A18-F8BF-423F-9E3A-957414D52C4B")
          set(CPACK_WIX_VERSION "4")
          set(CPACK_WIX_EXTRA_SOURCES "D:/a/arrow/arrow/cpp/src/arrow/flight/sql/odbc/install/arrow-flight-sql-odbc.wxs")
          set(CPACK_WIX_PATCH_FILE "D:/a/arrow/arrow/cpp/src/arrow/flight/sql/odbc/install/arrow-flight-sql-odbc-patch.xml")
          set(CPACK_WIX_UI_BANNER "D:/a/arrow/arrow/cpp/src/arrow/flight/sql/odbc/install/arrow-wix-banner.bmp")
          set(CPACK_COMPONENTS_ALL "flight_sql_odbc_lib")
          set(CPACK_INSTALL_CMAKE_PROJECTS "D:/a/arrow/arrow/build/cpp;Arrow;flight_sql_odbc_lib;/")
          EOFCPACK
          fi
          cd build/cpp/src/arrow/flight/sql/odbc
          cpack -C Release
      - name: Upload ODBC Driver and Installer
        uses: actions/upload-artifact@v4
        with:
          name: odbc-driver-and-installer
          path: |
            build/*.msi
            build/cpp/Release/*.dll
          retention-days: 30
