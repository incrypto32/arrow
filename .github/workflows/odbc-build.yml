name: ODBC Driver Build

on:
  push:
    branches:
      - '**'
    paths:
      - 'cpp/src/arrow/flight/sql/odbc/**'
      - '.github/workflows/odbc-build.yml'
      - 'cpp/cmake_modules/DefineOptions.cmake'
      - 'ci/scripts/cpp_build.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHERY_DEBUG: 1
  ARROW_ENABLE_TIMING_TESTS: OFF

jobs:
  build-odbc-windows:
    name: Build ODBC Driver and Installer
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ARROW_BUILD_SHARED: ON
      ARROW_BUILD_STATIC: OFF
      ARROW_BUILD_TESTS: OFF
      ARROW_BUILD_TYPE: release
      ARROW_FLIGHT: ON
      ARROW_FLIGHT_SQL: ON
      ARROW_FLIGHT_SQL_ODBC: ON
      ARROW_FLIGHT_SQL_ODBC_INSTALLER: ON
      ARROW_HOME: /mingw64
      ARROW_COMPUTE: ON
      ARROW_DATASET: OFF
      ARROW_GANDIVA: OFF
      ARROW_GCS: OFF
      ARROW_HDFS: OFF
      ARROW_JEMALLOC: OFF
      ARROW_PARQUET: OFF
      ARROW_S3: OFF
      ARROW_SUBSTRAIT: OFF
      ARROW_USE_GLOG: OFF
      ARROW_VERBOSE_THIRDPARTY_BUILD: OFF
      ARROW_WITH_OPENTELEMETRY: OFF
      ARROW_CMAKE_ARGS: >-
        -DARROW_PACKAGE_PREFIX=/mingw64
        -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
    steps:
      - name: Disable Crash Dialogs
        run: |
          reg add `
            "HKCU\SOFTWARE\Microsoft\Windows\Windows Error Reporting" `
            /v DontShowUI `
            /t REG_DWORD `
            /d 1 `
            /f
      - name: Checkout Arrow
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Setup MSYS2
        shell: msys2 {0}
        run: ci/scripts/msys2_setup.sh cpp
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: cpp-ccache-mingw64-${{ hashFiles('cpp/**') }}
          restore-keys: cpp-ccache-mingw64-
      - name: Cache ODBC Build Output
        id: cache-odbc
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cpp/release/libarrow_flight_sql_odbc.dll
            build/cpp/release/*.dll
            build/cpp/src/arrow/flight/sql/odbc
          key: odbc-build-${{ runner.os }}-installer-enabled
          restore-keys: |
            odbc-build-${{ runner.os }}-
      - name: Build ODBC Driver
        if: steps.cache-odbc.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$NUMBER_OF_PROCESSORS
          ci/scripts/cpp_build.sh "$(pwd)" "$(pwd)/build"
      - name: Save ODBC Build Cache
        if: steps.cache-odbc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/cpp/release/libarrow_flight_sql_odbc.dll
            build/cpp/release/*.dll
            build/cpp/src/arrow/flight/sql/odbc
          key: odbc-build-${{ runner.os }}-installer-enabled
      - name: Generate Windows Installer
        shell: msys2 {0}
        run: |
          cd build/cpp/src/arrow/flight/sql/odbc
          cpack
      - name: Upload ODBC Driver and Installer
        uses: actions/upload-artifact@v4
        with:
          name: odbc-driver-and-installer
          path: |
            build/cpp/*/libarrow_flight_sql_odbc.dll
            build/cpp/*/Apache Arrow Flight SQL ODBC-*.msi
          retention-days: 30
